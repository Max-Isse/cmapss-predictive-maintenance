[project]
name = "cmapss-predictive-maintenance"
version = "0.1.0"
description = "Predictive maintenance on NASA C-MAPSS: PySpark + Delta medallion pipeline, RUL and failure-risk models, cost-based maintenance policy, FastAPI serving and monitoring"
authors = [
    { name = "Max-Isse", email = "59160619+Max-Isse@users.noreply.github.com" }
]
requires-python = ">=3.11"
# Core: what the API image needs (scoring, MLflow, Delta reads without a JVM). The Spark pipeline, reports and
# data contract are the `pipeline` extra (D-026); the dev image and CI install it with --all-extras.
dependencies = [
    "deltalake>=1.1",
    "fastapi>=0.115",
    "lightgbm>=4.6",
    "mlflow>=3.5",
    "numpy>=2.4.6",
    "pandas>=2.2,<3",  # pandera's PySpark backend needs pandas < 3
    "pyarrow>=18,<26",  # upper bound from mlflow
    "pyyaml>=6.0.3",
    "scikit-learn>=1.7",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
pipeline = [
    "delta-spark>=4.0,<4.1",
    "matplotlib>=3.10",
    "pandera[pyspark]>=0.35.0",
    "pyspark>=4.0,<4.1",
    "tabulate>=0.10.0",
]

[build-system]
requires = ["uv_build>=0.11.18,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "cmapss_pm"

[project.scripts]
cmapss = "cmapss_pm.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[dependency-groups]
dev = [
    "httpx>=0.28",
    "mypy>=2.4.1",
    "pandas-stubs>=3.1.0.261029",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "types-pyyaml>=6.0.12.20261030",
]
