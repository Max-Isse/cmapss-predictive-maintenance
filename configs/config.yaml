# Single source of truth for paths, thresholds, seeds and business assumptions.
# Values marked ASSUMPTION are not estimated from data; they are varied in sensitivity analysis.

seed: 20261101

paths:
  raw_dir: data/raw                  # downloaded archive + extracted NASA text files (git-ignored)
  landing_dir: data/landing          # files waiting to be ingested: text, Parquet conversions, replay batches
  lakehouse_dir: data/lakehouse      # Delta tables: bronze/, silver/, gold/ (git-ignored)
  manifest: data/raw_manifest.json   # committed: source URL, archive SHA-256, per-file row counts
  reports_dir: reports
  tables_dir: reports/tables
  figures_dir: reports/figures
  artifacts_dir: artifacts           # fitted feature spec, models (git-ignored; the spec is copied to reports/tables)

source:
  # Official NASA Prognostics Center of Excellence repository, data set 6 (C-MAPSS).
  page: https://www.nasa.gov/intelligent-systems-division/discovery-and-systems-health/pcoe/pcoe-data-set-repository/
  url: https://phm-datasets.s3.amazonaws.com/NASA/6.+Turbofan+Engine+Degradation+Simulation+Data+Set.zip
  archive_sha256: c9c5dec12a945a82e8bb4446589d7fb3cc057b5e5d81fa1a12e25ee9912ad3b2
  inner_archive: CMAPSSData.zip
  datasets: [FD001, FD002, FD003, FD004]

schema:
  # 26 space-separated numeric columns per row (one row = one engine operating cycle).
  key: [unit, cycle]
  settings: [op_setting_1, op_setting_2, op_setting_3]
  n_sensors: 21

validation:
  # Contract ranges (inclusive): TRAINING min/max widened by `range_margin` x range on each side, fixed here
  # once from the training files (D-007). Test values all fall inside the unwidened training ranges.
  range_margin: 0.10
  max_cycle: 1000                           # sanity bound on the cycle counter
  ranges:
    op_setting_1: [-4.2104, 46.2097]
    op_setting_2: [-0.0849, 0.9263]
    op_setting_3: [56.0000, 104.0000]
    sensor_01: [437.6330, 526.0370]
    sensor_02: [524.5170, 656.0730]
    sensor_03: [1205.2460, 1654.3340]
    sensor_04: [981.9980, 1483.2620]
    sensor_05: [2.8390, 15.6910]
    sensor_06: [4.0760, 23.2040]
    sensor_07: [92.7060, 614.2740]
    sensor_08: [1867.3280, 2436.0320]
    sensor_09: [7858.5020, 9370.5980]
    sensor_10: [0.8910, 1.3590]
    sensor_11: [34.7910, 49.7790]
    sensor_12: [87.3920, 578.4080]
    sensor_13: [1991.2780, 2426.7820]
    sensor_14: [7800.9860, 8338.5140]
    sensor_15: [7.8652, 11.3580]
    sensor_16: [0.0190, 0.0310]
    sensor_17: [292.2000, 409.8000]
    sensor_18: [1867.7000, 2435.3000]
    sensor_19: [83.4230, 101.5070]
    sensor_20: [7.1870, 42.8630]
    sensor_21: [4.2165, 25.7445]

business:
  # ---- ASSUMPTIONS (costs in thousand currency units; no real cost data accompany C-MAPSS) ----
  unplanned_failure_cost: 1000          # ASSUMPTION: in-service failure incl. disruption, secondary damage, AOG
  planned_maintenance_cost: 200         # ASSUMPTION: scheduled shop visit
  lost_life_cost_per_cycle: 1.0         # ASSUMPTION: value of each cycle of useful life given up by pulling early
  maintenance_lead_time_cycles: 30      # ASSUMPTION: cycles needed to schedule a shop visit = N in "fail within N"

features:
  # Fitted on TRAINING engines only (FD001-FD004 pooled) and applied unchanged to test, replay and serving (D-013).
  n_conditions: 6                   # operating conditions = k for k-means on the 3 settings (readme; confirmed, D-014)
  kmeans_restarts: 10               # k-means runs from different seeds; the lowest within-cluster cost wins
  constant_max_distinct: 2          # drop a sensor with <= this many distinct values in EVERY condition (D-013)
  windows: [5, 15, 30]              # rolling windows in cycles: mean, std and slope of each normalised sensor
  rul_cap: 125                      # piecewise-linear RUL target cap (D-016; evidence in reports/features.md)
  # failure-within-N horizon N = business.maintenance_lead_time_cycles
  # RUL-cap diagnostic only: sensors whose normalised value rises with wear in all four datasets, and the
  # early-life cycles used as each engine's own baseline
  health_index_sensors: [sensor_02, sensor_03, sensor_04, sensor_11, sensor_17]
  baseline_cycles: 30

replay:
  # SYNTHETIC REPLAY (phase 4, D-018): the real NASA test-engine rows, re-delivered batch by batch into
  # landing/replay/ as if the fleet were flying now. Values are real; arrival time and order are simulated.
  datasets: [FD001, FD002, FD003, FD004]
  cycles_per_batch: 25              # cycles each engine flies between two deliveries
  late_rows: 5                      # SYNTHETIC disturbance per batch: rows held back to the next batch; 0 = none

spark:
  master: local[4]
  shuffle_partitions: 8
  driver_memory: 4g
